<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Clean white background or transparent -->
  <rect width="100" height="100" rx="20" fill="#0f172a" />
  <g transform="translate(10, 10) scale(0.8)" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Table top -->
    <polygon points="20,15 80,15 95,35 5,35" fill="none" />
    <line x1="38" y1="15" x2="30" y2="35" />
    <line x1="62" y1="15" x2="70" y2="35" />
    <!-- Pavilion to culet point -->
    <polygon points="5,35 95,35 50,85" fill="none" />
    <line x1="30" y1="35" x2="50" y2="85" />
    <line x1="70" y1="35" x2="50" y2="85" />
  </g>
</svg>
