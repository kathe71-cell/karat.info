<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Crisp vector diamond matching user logo -->
  <g stroke="#000000" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 3)">
    <!-- Top Table -->
    <line x1="18" y1="12" x2="82" y2="12" />
    <!-- Girdle -->
    <line x1="4" y1="36" x2="96" y2="36" />
    <!-- Outer Upper Facets -->
    <line x1="18" y1="12" x2="4" y2="36" />
    <line x1="82" y1="12" x2="96" y2="36" />
    <!-- Inner Upper Facets -->
    <line x1="39" y1="12" x2="28" y2="36" />
    <line x1="61" y1="12" x2="72" y2="36" />
    <!-- Lower Pavilion Facets -->
    <line x1="4" y1="36" x2="50" y2="88" />
    <line x1="96" y1="36" x2="50" y2="88" />
    <line x1="28" y1="36" x2="50" y2="88" />
    <line x1="72" y1="36" x2="50" y2="88" />
  </g>
</svg>
